<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Change Safar passcode</title>
<style>body{font-family:system-ui,sans-serif;max-width:460px;margin:30px auto;padding:0 16px;background:#faf3e4;color:#2b2118}label{display:block;margin:12px 0 4px;font-weight:600;font-size:14px}input{width:100%;padding:10px;font-size:16px;box-sizing:border-box;border:1px solid #d9c9ad;border-radius:10px}button{margin-top:16px;padding:12px;width:100%;font-size:16px;border:0;border-radius:12px;background:#b4501e;color:#fff;font-weight:600}#m{margin-top:12px;font-size:14px}</style></head><body>
<h2>🔒 Change the Safar passcode</h2>
<p>This runs only in your browser; nothing is uploaded. Choose your current <b>trip.enc</b>, type the old and new passcodes, and download the new <b>trip.enc</b>. Then upload it to GitHub, replacing the old one.</p>
<label>Current trip.enc</label><input type="file" id="f">
<label>Old passcode</label><input id="o" type="password" autocomplete="off">
<label>New passcode (use 12+ characters; letters, numbers, dashes)</label><input id="n" type="text" autocomplete="off">
<button id="go">Create new trip.enc</button><div id="m"></div>
<script>
const b64=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0)),enc=u=>btoa(String.fromCharCode(...u)),T=new TextEncoder();
async function key(p,salt,n,use){const km=await crypto.subtle.importKey('raw',T.encode(p.trim().toLowerCase()),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,[use])}
document.getElementById('go').onclick=async()=>{const m=document.getElementById('m');try{
 const file=document.getElementById('f').files[0];if(!file)throw Error('Choose trip.enc first');
 const b=JSON.parse(await file.text()),o=document.getElementById('o').value,n=document.getElementById('n').value.trim();
 if(n.length<10)throw Error('New passcode must be at least 10 characters');
 let plain;try{plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(b.i)},await key(o,b64(b.s),b.n,'decrypt'),b64(b.c))}catch{throw Error('The old passcode is wrong')}
 const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),N=250000;
 const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await key(n,salt,N,'encrypt'),plain));
 const out=JSON.stringify({v:1,n:N,s:enc(salt),i:enc(iv),c:enc(ct)});
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'application/json'}));a.download='trip.enc';a.click();
 m.style.color='#2e7d32';m.textContent='Done – trip.enc downloaded. Upload it to GitHub, then reload the app.'}catch(e){m.style.color='#b3261e';m.textContent=e.message}};
</script></body></html>
