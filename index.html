<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b4531e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Safar">
<title>Safar – Trip Planner</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="lock" hidden>
  <form autocomplete="off">
    <div class="lockico">🔒</div>
    <h2>Safar</h2>
    <p>Private trip planner. Enter your passcode to open it.</p>
    <input name="pass" type="password" placeholder="Passcode" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Passcode">
    <label class="rem"><input type="checkbox" name="remember" checked> Remember on this device for 30 days</label>
    <button class="btn" type="submit">Unlock</button>
    <div id="lockErr" role="alert"></div>
  </form>
</div>
<header class="top">
  <div>
    <h1 id="tripTitle">Safar</h1>
    <div class="sub" id="tripSub"></div>
  </div>
  <div class="hdr-actions"><button id="installBtn" class="badge" hidden title="Install Safar on this device" aria-label="Install app"><img src="icon.svg" alt="" width="16" height="16" style="vertical-align:-3px;border-radius:4px"> Install</button><button id="gearBtn" class="badge" title="Trip settings (name, dates, budget, names)" aria-label="Trip settings">⚙️</button><button id="syncBadge" class="badge" title="Sync status">Local</button></div>
</header>

<main id="view"></main>

<nav class="tabs" id="tabs">
  <button data-tab="home"><span>🏠</span>Home</button>
  <button data-tab="plan"><span>🗓️</span>Plan</button>
  <button data-tab="book"><span>🎫</span>Transport</button>
  <button data-tab="hotels"><span>🏨</span>Hotels</button>
  <button data-tab="places"><span>📍</span>Places</button>
  <button data-tab="map"><span>🗺️</span>Map</button>
  <button data-tab="money"><span>💰</span>Money</button>
  <button data-tab="lists"><span>✅</span>Lists</button>
</nav>

<dialog id="modal"><form method="dialog" id="modalForm"></form></dialog>
<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
